server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: transfer-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transfer_db}
    username: ${SPRING_DATASOURCE_USERNAME:transfer_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:transfer_dev_password}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Адрес account-service для внутренних вызовов
account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
