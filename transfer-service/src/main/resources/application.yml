server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: transfer-service
  # Локальные значения для запуска из IDE/Maven (JWT_PUBLIC_KEY_PATH и др.) лежат в общем .env.
  # Формат .properties: пути только с прямыми слэшами (C:/Projects/...).
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/transfer_db}
    username: ${SPRING_DATASOURCE_USERNAME:transfer_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:transfer_dev_password}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    # Продюсер outbox-publisher. Таймауты заданы явно, чтобы недоступный брокер не вешал проход на минуты
    # (по умолчанию max.block.ms = 60s, delivery.timeout.ms = 120s).
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # Должно выполняться: delivery.timeout.ms >= request.timeout.ms + linger.ms (иначе продюсер не создастся).
        linger.ms: 5
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
        # Сколько send() может ждать метаданные топика при недоступном брокере.
        max.block.ms: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Путь к public.pem (X.509 PEM). Значения по умолчанию нет: пустой путь останавливает старт
    # с понятным сообщением. Закрытого ключа у этого сервиса нет и быть не должно.
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}

  # Фоновое добивание переводов, зависших в PENDING (account-service был недоступен)
  pending-retry:
    # Выключатель: false отключает планировщик (сам код остаётся). По умолчанию включено.
    enabled: ${PENDING_RETRY_ENABLED:true}
    # Пауза между запусками (отсчёт от конца предыдущего, запуски не накладываются).
    interval: 30s
    # Трогаем только переводы старше этого возраста: свежий PENDING, скорее всего, прямо сейчас
    # обрабатывается запросом клиента. Должно быть заметно больше времени одного вызова
    # (max-attempts x read-timeout + паузы).
    min-age: 60s
    # Сколько переводов берём за один запуск (самые старые первыми).
    batch-size: 50

  # Публикация событий из outbox_events в Kafka (at-least-once)
  outbox:
    # Выключатель: false отключает планировщик и создание топика (сам код остаётся). По умолчанию включено.
    enabled: ${OUTBOX_ENABLED:true}
    # Пауза между проходами (отсчёт от конца предыдущего, проходы не накладываются).
    interval: 1s
    # Сколько событий берём за один проход (самые старые первыми).
    batch-size: 100
    # Сколько ждём подтверждения Kafka по одному событию. Держать не больше delivery.timeout.ms продюсера:
    # тогда событие, по которому ожидание истекло, обычно и не доставлено.
    send-timeout: 5s

# Внутренние вызовы account-service (POST /internal/transfers)
account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  # Общий секрет для заголовка X-Internal-Token; тот же, что у account-service.
  # Пустое значение останавливает старт. В логи не попадает.
  internal-token: ${INTERNAL_API_TOKEN:internal_dev_token}
  connect-timeout: 2s
  read-timeout: 5s
  # Повтор при 503, 5xx, таймауте и сетевой ошибке (с тем же transferId): всего попыток за один вызов и пауза между ними.
  # После исчерпания перевод остаётся PENDING, его добьёт фоновая задача.
  max-attempts: 3
  retry-backoff: 200ms
