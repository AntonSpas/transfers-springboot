server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:notification_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:notification_dev_password}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    # Ключ и значение читаем строками: класс события выбирается по заголовку event-type, JSON разбирает ObjectMapper
    # (так битое сообщение не ломает сам консьюмер, а уходит в DLT как обычная неповторяемая ошибка).
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Смещение коммитится после обработки каждого сообщения (после успешной транзакции БД).
      ack-mode: record
      # По одному потоку на партицию топика (3 партиции). Порядок сохраняется внутри партиции, то есть внутри перевода.
      concurrency: 3
    # Продюсер нужен только для публикации в DLT. Таймауты заданы явно, чтобы недоступный брокер не вешал обработку
    # на минуты (по умолчанию max.block.ms = 60s, delivery.timeout.ms = 120s).
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Должно выполняться: delivery.timeout.ms >= request.timeout.ms + linger.ms (иначе продюсер не создастся).
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
        # Сколько send() может ждать метаданные топика при недоступном брокере.
        max.block.ms: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Потребитель событий переводов (Kafka)
  consumer:
    # Выключатель: false отключает слушатель и создание DLT-топика (сам сервис продолжает работать). По умолчанию включено.
    enabled: ${CONSUMER_ENABLED:true}
    # Блокирующие повторы при любой ошибке обработки, кроме дефекта самого события (тот сразу уходит в DLT).
    # Партиция на это время стоит: так сохраняется порядок событий. После исчерпания повторов сообщение уходит
    # в DLT (transfers.events.v1.DLT). Значения по умолчанию дают окно около 3 минут: паузы 1, 2, 4, 8, 16 с
    # и ещё пять по 30 с, всего 181 с.
    retry:
      # Сколько ПОВТОРОВ после первой неудачи (всего попыток на одну больше).
      attempts: 10
      initial-interval: 1s
      multiplier: 2
      max-interval: 30s

  # Отправка уведомлений из таблицы notifications (NEW -> SENDING -> SENT/FAILED) через заменяемый канал.
  # Партия захватывается короткой транзакцией, отправка идёт вне транзакции, итог каждого пишется отдельно.
  dispatch:
    # Выключатель: false отключает планировщик отправки (сам код остаётся). По умолчанию включено.
    enabled: ${DISPATCH_ENABLED:true}
    # Пауза между проходами (от конца предыдущего).
    interval: 1s
    # Сколько уведомлений берём за один проход (самые старые первыми), от 1 до 1000.
    batch-size: 100
    # Аренда захваченных уведомлений. Если проход не записал итог (падение, сбой БД), после неё уведомление
    # отправляется снова. Больше 0; должна быть заметно больше времени отправки одной партии.
    lease: 2m
    # Повторы после неудачной отправки. Пока попыток меньше max-attempts, уведомление возвращается в NEW с паузой;
    # после последней неудачи статус FAILED (вернуть вручную: POST /internal/notifications/{id}/retry).
    # По умолчанию паузы 10, 20, 40 и 80 с.
    retry:
      # Всего попыток, включая первую (от 1 до 100).
      max-attempts: 5
      initial-backoff: 10s
      multiplier: 2
      max-backoff: 10m

  # Внутреннее API (/internal/**): общий секрет в заголовке X-Internal-Token. Пустое значение останавливает старт.
  internal:
    api-token: ${INTERNAL_API_TOKEN:internal_dev_token}
