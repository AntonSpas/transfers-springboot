name: transfers-springboot

# Инфраструктура (postgres, redis, kafka) запускается всегда:
#   docker compose up -d
# Сервисы приложения — только с профилем apps:
#   docker compose --profile apps up -d --build
x-spring-service: &spring-service
  profiles: ["apps"]
  restart: unless-stopped
  mem_limit: 512m
  depends_on:
    postgres: { condition: service_healthy }
    kafka:    { condition: service_healthy }
    redis:    { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 40s

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_dev_password}
      # читаются скриптом docker/postgres-init/00_init_databases.sh
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:-account_dev_password}
      TRANSFER_DB_PASSWORD: ${TRANSFER_DB_PASSWORD:-transfer_dev_password}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # выполняется только при первом старте на пустом томе
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      # kafka:9092 — для контейнеров, localhost:29092 — для сервисов, запущенных из IDE
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    ports: ["29092:29092"]
    mem_limit: 768m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  account-service:
    <<: *spring-service
    build: { context: ., args: { MODULE: account-service } }
    ports: ["8081:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: account_svc
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_DB_PASSWORD:-account_dev_password}
      # JWT-ключи добавим на шаге аутентификации:
      #   JWT_PRIVATE_KEY_LOCATION: file:/keys/private.pem
      #   JWT_PUBLIC_KEY_LOCATION: file:/keys/public.pem
    # volumes: ["./keys:/keys:ro"]

  transfer-service:
    <<: *spring-service
    build: { context: ., args: { MODULE: transfer-service } }
    ports: ["8082:8080"]
    depends_on:
      postgres:        { condition: service_healthy }
      kafka:           { condition: service_healthy }
      redis:           { condition: service_healthy }
      account-service: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transfer_db
      SPRING_DATASOURCE_USERNAME: transfer_svc
      SPRING_DATASOURCE_PASSWORD: ${TRANSFER_DB_PASSWORD:-transfer_dev_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      ACCOUNT_SERVICE_URL: http://account-service:8080
      # на шаге JWT: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC_KEY_LOCATION: file:/keys/public.pem
    # volumes: ["./keys/public.pem:/keys/public.pem:ro"]

  notification-service:
    <<: *spring-service
    build: { context: ., args: { MODULE: notification-service } }
    ports: ["8083:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: notification_svc
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_dev_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

volumes:
  pgdata:
  kafkadata:
